<!DOCTYPE html>
<html lang="en">
<head>
    <meta name="color-scheme" content="light">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Roohi's | Luxury Skincare</title>
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;1,400&family=Plus+Jakarta+Sans:wght@300;400;500&display=swap" rel="stylesheet">
    <!-- External Stylesheet -->
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- Transparent Navbar -->
    <nav id="navbar">
        <a href="#" class="nav-logo">ROOHI'S</a>
        <ul class="nav-links">
            <li><a href="#">Shop</a></li>
            <li><a href="#">Collections</a></li>
            <li><a href="#">Account</a></li>
        </ul>
    </nav>

    <!-- Hero Section -->
    <section class="hero">
        <h1 class="hero-title" id="heroTitle">ROOHI'S</h1>
    </section>

<!-- Full-Canvas Floating Product Section -->
<section class="floating-product-section" id="floatingSection">
    <!-- Giant text sitting behind the PNG -->
    <div class="background-text">PURIFY</div>
    
    <!-- Floating Cleanser PNG -->
    <div class="floating-wrapper" id="floatingWrapper">
        <img src="media/cleanser.png" alt="Cleanser Product">
    </div>
</section>
<!-- Second Div: Featured Product Info -->
<section class="featured-product-section" style="background-color: var(--main-bg); color: var(--main-text); padding: 40px 20px; text-align: center;">
  <h2 id="productTitleDisplay" style="color: var(--main-text); font-weight: 700; font-size: 2rem; margin-bottom: 10px;">CeraVe Blemish Control Cleanser</h2>
  <p id="productDescDisplay" style="color: var(--main-text); font-size: 1.1rem; opacity: 0.9;">Clears blemishes, reduces blackheads, and improves skin texture.</p>
</section>
<!-- Featured Image Slider Section -->
<section class="slider-container">
    <div class="slider-wrapper">
        <button id="prevSlideBtn" class="slider-arrow left">&lt;</button>
        <div id="sliderTrack" class="slider-track">
            <!-- Dynamic images from Turso render here -->
        </div>
        <button id="nextSlideBtn" class="slider-arrow right">&gt;</button>
    </div>
</section>
<!-- Main Dynamic Storefront Categories -->
<main>
    <div id="dynamicCategoriesContainer"></div>
</main>
    <!-- External JavaScript -->
    <script src="script.js"></script>
</body>
</html>
