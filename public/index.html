<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Roohi's | Industrial Clinical Beauty</title>
    <!-- Google Fonts Link -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Great+Vibes&family=Montserrat:wght@300;400;600&display=swap" rel="stylesheet">
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', sans-serif; }
        body { background-color: #0f1115; color: #f0f2f5; padding: 20px; }
        header { text-align: center; margin-bottom: 40px; border-bottom: 1px solid #2a2e37; padding-bottom: 20px; }
        h1 { font-family: 'Great Vibes', cursive; font-size: 2.5rem; letter-spacing: 2px; text-transform: uppercase; color: #ffffff; }
        p.subtitle { color: #8a94a6; margin-top: 5px; }
        .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 20px; max-width: 1200px; margin: 0 auto; }
        .card { background: #181b21; border: 1px solid #2a2e37; border-radius: 8px; padding: 20px; transition: transform 0.2s; }
        .card:hover { transform: translateY(-4px); border-color: #4a5568; }
        .card img { width: 100%; border-radius: 4px; margin-bottom: 15px; }
        .card h3 { color: #fff; margin-bottom: 8px; }
        .card p { color: #8a94a6; font-size: 0.9rem; margin-bottom: 15px; }
        .price { font-size: 1.25rem; font-weight: bold; color: #63b3ed; }
        .btn { display: inline-block; width: 100%; padding: 10px; background: #3182ce; color: white; border: none; border-radius: 4px; font-weight: bold; cursor: pointer; text-align: center; margin-top: 10px; }
        .btn:hover { background: #2b6cb0; }
    </style>
</head>
<body>

    <header>
        <h1>ROOHI'S</h1>
        <p class="subtitle">Clinical Formulations & Industrial Skincare</p>
    </header>

    <div class="grid" id="product-grid">
        <!-- Database items populate here dynamically -->
    </div>

    <script>

    </script>
</body>
</html>
