<!DOCTYPE html>
<html lang="en">
<head>
<!-- Firebase Core & Auth SDKs -->
<script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-auth-compat.js"></script>

<!-- Your Custom Auth Handler -->
<script src="auth.js"></script>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Product Details</title>
    <link rel="stylesheet" href="style.css">
    <style>
        .auth-modal-overlay {
  position: fixed;
  top: 0; left: 0; width: 100%; height: 100%;
  background: rgba(0, 0, 0, 0.5);
  display: flex; justify-content: center; align-items: center;
  z-index: 1000;
  backdrop-filter: blur(4px);
}

.auth-modal-card {
  background: #fff;
  padding: 30px;
  border-radius: 12px;
  width: 90%; max-width: 400px;
  position: relative;
  box-shadow: 0 10px 25px rgba(0,0,0,0.15);
  text-align: center;
}

.auth-modal-close {
  position: absolute; top: 15px; right: 15px;
  background: none; border: none; font-size: 24px; cursor: pointer; color: #666;
}

.social-login-btn {
  width: 100%; padding: 12px;
  border: 1px solid #ccc; border-radius: 6px;
  background: #fff; display: flex; align-items: center; justify-content: center;
  gap: 10px; font-weight: 600; cursor: pointer; transition: background 0.2s;
}

.social-login-btn:hover { background: #f8f9fa; }

.auth-divider {
  margin: 20px 0; border-bottom: 1px solid #eee; line-height: 0.1em;
}

.auth-divider span { background:#fff; padding:0 10px; color: #888; font-size: 12px; }

.auth-input {
  width: 100%; padding: 12px; margin-bottom: 10px;
  border: 1px solid #ddd; border-radius: 6px; box-sizing: border-box;
}

.auth-submit-btn {
  width: 100%; padding: 12px;
  background: #000; color: #fff; border: none;
  border-radius: 6px; font-weight: 600; cursor: pointer;
}
        body {
            background-color: var(--main-bg, #fdfbf7);
            color: var(--main-text, #1a1a1a);
            margin: 0;
            padding: 20px;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        }

        .product-page-container {
            max-width: 1100px;
            margin: 40px auto;
            display: flex;
            flex-direction: column;
            gap: 30px;
        }

        /* Desktop side-by-side view */
        @media (min-width: 768px) {
            .product-page-container {
                flex-direction: row;
                align-items: flex-start;
            }
            .product-image-container {
                flex: 1;
                max-width: 50%;
            }
            .product-info-container {
                flex: 1;
            }
        }

        /* Rounded rectangle image container */
        .product-image-container {
            width: 92%;
            margin: 0 auto;
            background-color: var(--secondary-color, #ffffff);
            border-radius: 20px;
            padding: 20px;
            box-shadow: 0 8px 24px rgba(0,0,0,0.05);
            display: flex;
            justify-content: center;
            align-items: center;
            box-sizing: border-box;
        }

        .product-image-container img {
            width: 100%;
            height: auto;
            max-height: 450px;
            object-fit: contain;
            border-radius: 12px;
        }

        .product-info-container {
            padding: 10px;
        }

        .product-title {
            font-size: 2rem;
            margin-top: 0;
        }

        .product-price {
            font-size: 1.5rem;
            font-weight: bold;
            margin: 15px 0;
        }

        .quantity-control {
            display: flex;
            align-items: center;
            gap: 10px;
            margin: 20px 0;
        }

        .qty-btn {
            padding: 8px 16px;
            font-size: 1.2rem;
            border: 1px solid rgba(0,0,0,0.2);
            background: transparent;
            cursor: pointer;
            border-radius: 6px;
            color: var(--main-text, #1a1a1a);
        }

        .action-btn {
            width: 100%;
            padding: 14px;
            font-size: 1rem;
            font-weight: bold;
            border-radius: 8px;
            border: none;
            cursor: pointer;
            margin-bottom: 12px;
        }

        .btn-cart {
            background-color: var(--main-text, #1a1a1a);
            color: var(--main-bg, #fdfbf7);
        }

        .btn-whatsapp {
            background-color: #25D366;
            color: #ffffff;
        }
    </style>
</head>
<body>

    <div class="product-page-container" id="productPageContent">
        <p>Loading product details...</p>
    </div>

    <!-- Slide-Out Cart Overlay & Drawer Markup -->
    <div id="cartOverlay" class="cart-overlay"></div>
    <aside id="cartDrawer" class="cart-drawer">
        <div class="cart-header">
            <h3>YOUR SHOPPING BAG</h3>
            <button id="closeCartBtn" class="close-cart-btn">&times;</button>
        </div>

        <div id="cartItemsContainer" class="cart-items-container"></div>

        <div class="cart-footer">
            <div class="cart-total-row">
                <span>Subtotal</span>
                <span id="cartTotalAmount">0 BDT</span>
            </div>
            <button id="checkoutBtn" class="checkout-btn">ORDER ON WHATSAPP</button>
        </div>
    </aside>
    <!-- Auth Modal -->
<div id="authModal" class="auth-modal-overlay" style="display: none;">
  <div class="auth-modal-card">
    <button class="auth-modal-close" onclick="closeAuthModal()">&times;</button>
    
    <div class="auth-modal-header">
      <h2>Welcome to Roohi's</h2>
      <p>Sign in to manage your account and track orders</p>
    </div>

    <!-- Google Login Button -->
    <button class="social-login-btn google-btn" onclick="loginWithGoogle()">
      <svg width="18" height="18" viewBox="0 0 24 24"><path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"/><path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/><path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.06H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.94l2.85-2.22.81-.63z"/><path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.06l3.66 2.84c.87-2.6 3.3-4.52 6.16-4.52z"/></svg>
      Continue with Google
    </button>

    <div class="auth-divider"><span>OR</span></div>

    <!-- Email Form -->
    <form id="emailLoginForm" onsubmit="handleEmailAuth(event)">
      <input type="email" id="authEmail" placeholder="Email Address" required class="auth-input">
      <input type="password" id="authPassword" placeholder="Password" required class="auth-input">
      <button type="submit" class="auth-submit-btn">Continue with Email</button>
    </form>
  </div>
</div>

    <!-- Include main script for cart system controller -->
    <script src="script.js"></script>

    <script>
        let currentProduct = null;
        let quantity = 1;

        async function initProductPage() {
            const params = new URLSearchParams(window.location.search);
            const id = params.get('id');

            // Apply theme colors
            try {
                const configRes = await fetch('/api/get-config');
                const config = await configRes.json();
                document.documentElement.style.setProperty('--main-bg', config.backgroundColor || '#fdfbf7');
                document.documentElement.style.setProperty('--secondary-color', config.secondaryColor || '#ffffff');
                document.documentElement.style.setProperty('--main-text', config.textColor || '#1a1a1a');
                document.documentElement.style.setProperty('--text-hover', config.textHoverColor || '#d4af37');
            } catch (err) {
                console.error('Error loading config:', err);
            }

            if (!id) return;

            try {
                const prodRes = await fetch('/api/get-products');
                const products = await prodRes.json();
                currentProduct = products.find(p => p.id == id);
            } catch (err) {
                console.error('Error loading product:', err);
            }

            if (!currentProduct) return;

            const container = document.getElementById('productPageContent');
            container.innerHTML = `
                <div class="product-image-container">
                    <img src="${currentProduct.image_url || 'media/cleanser.png'}" alt="${currentProduct.title}">
                </div>
                <div class="product-info-container">
                    <h1 class="product-title">${currentProduct.title}</h1>
                    <p class="product-price">${currentProduct.price} BDT</p>
                    <p>${currentProduct.short_desc || ''}</p>
                    
                    <div class="quantity-control">
                        <span>Quantity:</span>
                        <button class="qty-btn" onclick="updateQty(-1)">-</button>
                        <span id="qtyDisplay" style="font-weight:bold;">1</span>
                        <button class="qty-btn" onclick="updateQty(1)">+</button>
                    </div>

                    <button class="action-btn btn-cart" onclick="handleAddToCart()">Add to Cart</button>
                    <button class="action-btn btn-whatsapp" onclick="contactWhatsApp()">Contact on WhatsApp</button>

                    <div style="margin-top: 30px; border-top: 1px solid rgba(0,0,0,0.1); padding-top: 20px;">
                        <h3>Description</h3>
                        <p>${currentProduct.long_desc || currentProduct.short_desc || 'No additional details.'}</p>
                    </div>
                </div>
            `;
        }

        function updateQty(change) {
            quantity = Math.max(1, quantity + change);
            document.getElementById('qtyDisplay').textContent = quantity;
        }

        function handleAddToCart() {
            if (!currentProduct) return;

            let cart = JSON.parse(localStorage.getItem('cart') || '[]');
            
            // Look for existing item
            const existingIndex = cart.findIndex(item => item.id === currentProduct.id);
            if (existingIndex > -1) {
                cart[existingIndex].quantity += quantity;
            } else {
                cart.push({
                    id: currentProduct.id,
                    title: currentProduct.title,
                    price: currentProduct.price,
                    image_url: currentProduct.image_url,
                    quantity: quantity
                });
            }

            // Save to localStorage using key 'cart'
            localStorage.setItem('cart', JSON.stringify(cart));

            // Sync badge counter & trigger slide-out drawer open
            if (typeof updateCartBadge === 'function') updateCartBadge();
            
            const cartDrawer = document.getElementById('cartDrawer');
            const cartOverlay = document.getElementById('cartOverlay');
            if (cartDrawer && cartOverlay) {
                cartDrawer.classList.add('open');
                cartOverlay.classList.add('active');
                if (typeof renderCartItems === 'function') renderCartItems();
            }
        }

        async function contactWhatsApp() {
            if (!currentProduct) return;

            let whatsappNumber = '';
            try {
                const res = await fetch('/api/get-config');
                if (res.ok) {
                    const rawData = await res.json();
                    const configMap = {};
                    if (Array.isArray(rawData)) {
                        rawData.forEach(item => { configMap[item.key] = item.value; });
                    } else {
                        Object.assign(configMap, rawData);
                    }
                    whatsappNumber = configMap.whatsapp_number || configMap.phone || configMap.hotline || '';
                }
            } catch (err) {
                console.error('Failed to load contact config:', err);
            }

            const cleanNumber = whatsappNumber.replace(/[^0-9]/g, '') || '8801700000000';
            const text = encodeURIComponent(`Hello, I want to inquire about: ${currentProduct.title} (Qty: ${quantity}) - Total: ${currentProduct.price * quantity} BDT`);
            window.open(`https://wa.me/${cleanNumber}?text=${text}`, '_blank');
        }

        document.addEventListener('DOMContentLoaded', initProductPage);
    </script>
</body>
</html>
