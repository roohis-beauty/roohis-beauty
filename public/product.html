<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Product Details</title>
    <link rel="stylesheet" href="style.css">
    <style>
        body {
            background-color: var(--main-bg);
            color: var(--main-text);
            margin: 0;
            padding: 20px;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        }

        .product-page-container {
            max-width: 1100px;
            margin: 40px auto;
            display: flex;
            flex-direction: column;
            gap: 30px;
        }

        /* Desktop side-by-side view */
        @media (min-width: 768px) {
            .product-page-container {
                flex-direction: row;
                align-items: flex-start;
            }
            .product-image-container {
                flex: 1;
                max-width: 50%;
            }
            .product-info-container {
                flex: 1;
            }
        }

        /* Rounded rectangle image container */
        .product-image-container {
            width: 92%;
            margin: 0 auto;
            background-color: var(--secondary-color);
            border-radius: 20px;
            padding: 20px;
            box-shadow: 0 8px 24px rgba(0,0,0,0.05);
            display: flex;
            justify-content: center;
            align-items: center;
            box-sizing: border-box;
        }

        .product-image-container img {
            width: 100%;
            height: auto;
            max-height: 450px;
            object-fit: contain;
            border-radius: 12px;
        }

        .product-info-container {
            padding: 10px;
        }

        .product-title {
            font-size: 2rem;
            margin-top: 0;
        }

        .product-price {
            font-size: 1.5rem;
            font-weight: bold;
            margin: 15px 0;
        }

        .quantity-control {
            display: flex;
            align-items: center;
            gap: 10px;
            margin: 20px 0;
        }

        .qty-btn {
            padding: 8px 16px;
            font-size: 1.2rem;
            border: 1px solid rgba(0,0,0,0.2);
            background: transparent;
            cursor: pointer;
            border-radius: 6px;
        }

        .action-btn {
            width: 100%;
            padding: 14px;
            font-size: 1rem;
            font-weight: bold;
            border-radius: 8px;
            border: none;
            cursor: pointer;
            margin-bottom: 12px;
        }

        .btn-cart {
            background-color: var(--main-text);
            color: var(--main-bg);
        }

        .btn-whatsapp {
            background-color: #25D366;
            color: #ffffff;
        }
    </style>
</head>
<body>

    <div class="product-page-container" id="productPageContent">
        <p>Loading product details...</p>
    </div>

    <script>
        let currentProduct = null;
        let quantity = 1;

        async function initProductPage() {
            const params = new URLSearchParams(window.location.search);
            const id = params.get('id');

            // Apply theme colors
            const configRes = await fetch('/api/get-config');
            const config = await configRes.json();
            document.documentElement.style.setProperty('--main-bg', config.backgroundColor || '#fdfbf7');
            document.documentElement.style.setProperty('--secondary-color', config.secondaryColor || '#ffffff');
            document.documentElement.style.setProperty('--main-text', config.textColor || '#1a1a1a');

            if (!id) return;

            const prodRes = await fetch('/api/get-products');
            const products = await prodRes.json();
            currentProduct = products.find(p => p.id == id);

            if (!currentProduct) return;

            const container = document.getElementById('productPageContent');
            container.innerHTML = `
                <div class="product-image-container">
                    <img src="${currentProduct.image_url || 'media/cleanser.png'}" alt="${currentProduct.title}">
                </div>
                <div class="product-info-container">
                    <h1 class="product-title">${currentProduct.title}</h1>
                    <p class="product-price">${currentProduct.price} BDT</p>
                    <p>${currentProduct.short_desc || ''}</p>
                    
                    <div class="quantity-control">
                        <span>Quantity:</span>
                        <button class="qty-btn" onclick="updateQty(-1)">-</button>
                        <span id="qtyDisplay" style="font-weight:bold;">1</span>
                        <button class="qty-btn" onclick="updateQty(1)">+</button>
                    </div>

                    <button class="action-btn btn-cart" onclick="addToCart()">Add to Cart</button>
                    <button class="action-btn btn-whatsapp" onclick="contactWhatsApp('${config.whatsapp_number || ''}')">Contact on WhatsApp</button>

                    <div style="margin-top: 30px; border-top: 1px solid rgba(0,0,0,0.1); padding-top: 20px;">
                        <h3>Description</h3>
                        <p>${currentProduct.long_desc || currentProduct.short_desc || 'No additional details.'}</p>
                    </div>
                </div>
            `;
        }

        function updateQty(change) {
            quantity = Math.max(1, quantity + change);
            document.getElementById('qtyDisplay').textContent = quantity;
        }

        function addToCart() {
            let cart = JSON.parse(localStorage.getItem('userCart') || '[]');
            cart.push({ ...currentProduct, qty: quantity });
            localStorage.setItem('userCart', JSON.stringify(cart));
            alert('Item added to cart!');
        }

        function contactWhatsApp(number) {
            const phone = number || '8801700000000';
            const text = encodeURIComponent(`Hello, I want to inquire about: ${currentProduct.title} (Qty: ${quantity}) - Total: ${currentProduct.price * quantity} BDT`);
            window.open(`https://wa.me/${phone}?text=${text}`, '_blank');
        }

        document.addEventListener('DOMContentLoaded', initProductPage);
    </script>
</body>
</html>
