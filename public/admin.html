<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Store Admin - Add Product</title>
    <style>
        body { font-family: sans-serif; max-width: 500px; margin: 40px auto; padding: 20px; background: #f9f9f9; border-radius: 8px; box-shadow: 0 2px 8px rgba(0,0,0,0.1); }
        input, textarea, button { width: 100%; padding: 10px; margin-bottom: 15px; border: 1px solid #ccc; border-radius: 4px; box-sizing: border-box; }
        button { background: #0070f3; color: white; border: none; font-weight: bold; cursor: pointer; }
        button:hover { background: #0051a2; }
    </style>
</head>
<body>
    <h2>Add New Product</h2>
    <form id="product-form">
        <label>Product Name</label>
        <input type="text" id="name" placeholder="e.g. Glow Serum" required>

        <label>Price ($)</label>
        <input type="number" step="0.01" id="price" placeholder="29.99" required>

        <label>Description</label>
        <textarea id="description" placeholder="Product details..." rows="3"></textarea>

        <label>Product Image from Gallery</label>
        <input type="file" id="imageFile" accept="image/*" required>

        <button type="submit" id="submit-btn">Upload & Add Product</button>
    </form>

    <script>
        document.getElementById('product-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            const btn = document.getElementById('submit-btn');
            btn.textContent = 'Processing...';

            const fileInput = document.getElementById('imageFile');
            const file = fileInput.files[0];

            const reader = new FileReader();
            reader.readAsDataURL(file);
            reader.onload = async () => {
                const base64Image = reader.result;

                try {
                    const res = await fetch('/api/products', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({
                            name: document.getElementById('name').value,
                            price: document.getElementById('price').value,
                            description: document.getElementById('description').value,
                            image: base64Image
                        })
                    });

                    if (res.ok) {
                        alert('Product added successfully!');
                        document.getElementById('product-form').reset();
                    } else {
                        alert('Failed to add product.');
                    }
                } catch (err) {
                    console.error(err);
                    alert('An error occurred.');
                } finally {
                    btn.textContent = 'Upload & Add Product';
                }
            };
        });
    </script>
</body>
</html>
